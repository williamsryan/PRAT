name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src scripts

      - name: Type check (mypy)
        run: mypy src/prat/

      - name: Run tests
        run: pytest src/tests/ -v --tb=short

      - name: Reproduction entry-point checks
        run: |
          python src/demo-runner.py --help
          python scripts/validate_paper_results.py --help
          python scripts/validate_batch_results.py --help
          python -m json.tool paper_expected_results.json >/dev/null
          bash -n scripts/fetch-targets.sh

      - name: Package check
        run: |
          pip install build twine
          python -m build
          twine check dist/*
